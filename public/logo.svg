<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red Metallic Main Gradient -->
    <linearGradient id="redMainGrad" x1="120" y1="80" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A36" />
      <stop offset="35%" stop-color="#DC0B17" />
      <stop offset="70%" stop-color="#8A020B" />
      <stop offset="100%" stop-color="#4A0005" />
    </linearGradient>

    <!-- Red Metallic Facet Highlight Gradient -->
    <linearGradient id="redFacetGrad" x1="180" y1="90" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA0A6" />
      <stop offset="25%" stop-color="#FF2A36" />
      <stop offset="70%" stop-color="#B00510" />
      <stop offset="100%" stop-color="#500006" />
    </linearGradient>

    <!-- Red Metallic Dark Shadow Facet -->
    <linearGradient id="redDarkFacet" x1="140" y1="200" x2="280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#80020A" />
      <stop offset="50%" stop-color="#480005" />
      <stop offset="100%" stop-color="#1A0002" />
    </linearGradient>

    <!-- Left Swoosh Crescent Red Gradient -->
    <linearGradient id="swooshGrad" x1="90" y1="120" x2="200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A36" />
      <stop offset="50%" stop-color="#B50510" />
      <stop offset="100%" stop-color="#4A0005" />
    </linearGradient>

    <!-- Silver Chrome Main Gradient -->
    <linearGradient id="silverMainGrad" x1="220" y1="180" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Silver Chrome Facet Highlight -->
    <linearGradient id="silverFacetGrad" x1="280" y1="200" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Silver Chrome Dark Shadow Facet -->
    <linearGradient id="silverDarkFacet" x1="230" y1="220" x2="340" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C1121F" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. Left Crescent Swoosh Outline & Body -->
    <path
      d="M 235 80 C 130 110 95 190 135 340 C 120 290 125 200 180 130 C 200 105 220 90 235 80 Z"
      fill="black"
      stroke="black"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <path
      d="M 235 80 C 130 110 95 190 135 340 C 120 290 125 200 180 130 C 200 105 220 90 235 80 Z"
      fill="url(#swooshGrad)"
      stroke="#4A0005"
      stroke-width="2"
    />

    <!-- 2. Silver Chrome Right Chevron Wing -->
    <path
      d="M 302 181 L 377 220 L 340 398 L 225 228 Z"
      fill="black"
      stroke="black"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Silver Outer Main Facet -->
    <path
      d="M 302 181 L 377 220 L 340 398 L 290 280 Z"
      fill="url(#silverMainGrad)"
      stroke="#1E293B"
      stroke-width="1"
    />

    <!-- Silver Inner Facet Light -->
    <path
      d="M 377 220 L 340 398 L 330 350 L 302 181 Z"
      fill="url(#silverFacetGrad)"
    />

    <!-- Silver Dark Under Facet -->
    <path
      d="M 340 398 L 225 228 L 290 280 Z"
      fill="url(#silverDarkFacet)"
    />

    <!-- Silver Center Ridge Line Highlight -->
    <path
      d="M 302 181 L 340 398"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- 3. Red Metallic Main Blade ("N" Left Leg + Peak + Diagonal) -->
    <path
      d="M 183 102 L 310 270 L 230 310 L 126 395 L 142 280 L 183 102 Z"
      fill="black"
      stroke="black"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Red Main Blade - Left Slope Facet (Highlight) -->
    <path
      d="M 183 102 L 195 240 L 126 395 L 142 280 Z"
      fill="url(#redFacetGrad)"
    />

    <!-- Red Main Blade - Center Diagonal Facet (Main Metallic) -->
    <path
      d="M 183 102 L 310 270 L 210 260 L 195 240 Z"
      fill="url(#redMainGrad)"
    />

    <!-- Red Main Blade - Lower Diagonal Under-cut Facet -->
    <path
      d="M 310 270 L 230 310 L 195 240 Z"
      fill="url(#redDarkFacet)"
    />

    <!-- Red Main Blade - Bottom Hook Facet -->
    <path
      d="M 195 240 L 230 310 L 126 395 Z"
      fill="url(#redMainGrad)"
    />

    <!-- Red Center Spine Bevel Highlight -->
    <path
      d="M 183 102 L 195 240 L 126 395"
      stroke="#FFA0A6"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
      d="M 183 102 L 310 270"
      stroke="#FF2A36"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
